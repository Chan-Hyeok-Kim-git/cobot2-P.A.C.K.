yolo_pointcloud:
  ros__parameters:
    model_path: ""
    sam_model_path: ""
    use_sam: true
    color_topic: "/camera/camera/color/image_raw"
    depth_topic: "/camera/camera/aligned_depth_to_color/image_raw"
    camera_info_topic: "/camera/camera/color/camera_info"
    points_topic: "/ai/object_points"
    background_points_topic: "/ai/background_points"
    objects_topic: "/ai/objects_3d/json"
    markers_topic: "/ai/objects_3d/markers"
    annotated_topic: "/ai/detections_3d/image"
    target_class_topic: "/ai/target_class"
    confidence: 0.4
    iou: 0.7
    image_size: 640
    device: "cpu"
    process_every_n: 1
    depth_scale: 0.001
    roi_scale: 0.4
    min_depth: 0.15
    max_depth: 3.0
    point_stride: 2
    depth_band: 0.05
    mask_erode_px: 3
    publish_background_points: true
    background_exclusion_mode: "all"
    target_class: ""
    background_mask_dilate_px: 5
    background_point_stride: 4
    max_background_points: 20000
    voxel_size: 0.005
    ransac_enabled: true
    ransac_distance_threshold: 0.008
    ransac_iterations: 100
    ransac_max_normal_angle_deg: 35.0
    ransac_min_plane_ratio: 0.15
    ransac_max_plane_ratio: 0.70
    dbscan_eps: 0.02
    dbscan_min_points: 20
    max_cluster_points: 5000
    min_valid_ratio: 0.3
    min_object_points: 20
    max_points_per_object: 5000
    sync_slop_sec: 0.08
    torch_num_threads: 2
    width: 640
    height: 480
